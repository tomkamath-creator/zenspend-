name: Build Android APK (SereneSpend)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: 📱 Build Installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Ensure Android Release Signing
        run: |
          cd android
          sed -i 's/signingConfig signingConfigs\.release/signingConfig signingConfigs\.debug/g' app/build.gradle || true
          cd ..

      - name: Build Standalone Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate & Prepare APK
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*release*.apk" -not -name "*unaligned*" | head -n 1)
          fi
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/SereneSpend.apk
            echo "Standalone Release APK ready at output/SereneSpend.apk"
            ls -lh output/SereneSpend.apk
          else
            echo "Error: Release APK not found!"
            find android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SereneSpend-Android-APK
          path: output/SereneSpend.apk
          retention-days: 14

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/SereneSpend.apk
          name: SereneSpend Release ${{ github.ref_name }}
          body: |
            ## 🌿 SereneSpend Mobile App
            - 100% Offline Expense Tracker & Budget Calculator
            - Download `SereneSpend.apk` directly to your phone and install.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
